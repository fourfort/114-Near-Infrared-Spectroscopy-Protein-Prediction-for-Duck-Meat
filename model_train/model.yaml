model:
  name: SpectralCNNLSTM
  input_channels: 1  # 輸入通道數
  backbone:
    - [-1, 1, Conv1d, [16, 5, 2]]  # [out_channels, kernel_size, padding]
    - [-1, 1, MaxPool1d, [2]]       # [kernel_size]
    - [-1, 1, Conv1d, [32, 5, 2]]  # [out_channels, kernel_size, padding]
    - [-1, 1, MaxPool1d, [2]]       # [kernel_size]
    - [-1, 1, Conv1d, [64, 3, 1]]  # [out_channels, kernel_size, padding]
    - [-1, 1, AdaptiveAvgPool1d, [8]]  # [output_size]
  head:
    - [-1, 1, LSTM, [64, 64, 1, true, false]]  # [input_size, hidden_size, num_layers, batch_first, bidirectional]
    - [-1, 1, Dropout, [0.3]]                  # [p]
    - [-1, 1, Linear, [64, 64]]                # [in_features, out_features]
    - [-1, 1, ReLU, []]                        # []
    - [-1, 1, Linear, [64, 1]]                 # [in_features, out_features]